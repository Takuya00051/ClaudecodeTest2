name: Deploy X-Clone to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'x-clone/**'
      - 'kyoto-literary-map/**'
      - '.github/workflows/deploy-x-clone.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: x-clone/package-lock.json

      - name: Install dependencies
        working-directory: x-clone
        run: npm ci

      - name: Build
        working-directory: x-clone
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Add kyoto-literary-map (static site served under /kyoto-literary-map/)
        run: cp -r kyoto-literary-map x-clone/dist/kyoto-literary-map

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: x-clone/dist

      - uses: actions/deploy-pages@v4
        id: deploy
