name: Build Page Turner APK

on:
  push:
    branches: [main]
    paths:
      - "page-turner/**"
      - ".github/workflows/page-turner-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: page-turner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: page-turner-apk
          path: page-turner/app/build/outputs/apk/debug/app-debug.apk

      # スマホのブラウザから直接ダウンロードできるよう、固定タグのリリースに置く
      - name: Publish to release "page-turner-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PageTurner.apk
          gh release delete page-turner-latest --yes --cleanup-tag || true
          gh release create page-turner-latest PageTurner.apk \
            --title "Page Turner (latest)" \
            --notes "Kindle漫画用ページめくりリモコン。${{ github.sha }} からビルド" \
            --target "${{ github.sha }}"
