        - paragraph [ref=f3e26]: BENOBI bros. — Figure Brand for Big Dog Lovers
        - heading "でっかい愛を、 ちっちゃく飾ろう。" [level=1] [ref=f3e27]:
          - text: でっかい愛を、
          - text: ちっちゃく飾ろう。
        - paragraph [ref=f3e28]: BENOBI bros.（ベンオビブラザーズ）は、大型犬専門のフィギュアブランド。犬種の祖から受け継がれた「らしさ」をフィギュアに落とし込み、世界中の大型犬オーナーが手に取れる、ちょうどいい存在を目指しています。
      - figure "small BIG Dogs — Bernese Mountain Dog" [ref=f3e29]:
        - img "バーニーズマウンテンドッグのフィギュア" [ref=f3e30]
        - generic [ref=f3e31]: small BIG Dogs — Bernese Mountain Dog
