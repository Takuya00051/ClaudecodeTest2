  - generic [ref=f3e35]:
    - generic [ref=f3e36]:
      - generic [ref=f3e37]: "01"
      - generic [ref=f3e38]: Concept
    - generic [ref=f3e39]:
      - generic [ref=f3e40]:
        - heading "犬種らしさを、 手に取れるスケールに。" [level=2] [ref=f3e41]:
          - text: 犬種らしさを、
          - text: 手に取れるスケールに。
        - paragraph [ref=f3e42]: 大型犬には、犬種ごとに受け継がれてきた固有の骨格、毛量、たたずまいがあります。BENOBI bros. がフィギュアに落とし込むのは、その「犬種らしさ」そのものです。
        - paragraph [ref=f3e43]: スケールを変えても、ひと目で「その犬種だ」とわかること。造形のすべてを、その基準で判断しています。
        - paragraph [ref=f3e44]: 目指すのは、大きすぎず、小さすぎず、飾る場所を選ばない——世界中の大型犬オーナーが手に取れる「ちょうどいい存在」です。
      - figure "small BIG Dogs — Golden Retriever" [ref=f3e45]:
        - img "ゴールデンレトリバーのフィギュア" [ref=f3e46]
        - generic [ref=f3e47]: small BIG Dogs — Golden Retriever
  - generic [ref=f3e49]:
    - generic [ref=f3e50]:
      - generic [ref=f3e51]: "02"
      - generic [ref=f3e52]: Philosophy
    - paragraph [ref=f3e53]:
      - text: 犬種の祖から受け継がれた「らしさ」を、フィギュアへ。
      - text: ブランドを支える、みっつの基準。
    - generic [ref=f3e54]:
      - generic [ref=f3e55]:
        - text: "1"
        - heading "犬種らしさへの解像度" [level=3] [ref=f3e56]
        - paragraph [ref=f3e57]: ハスキーの毛量、レオンベルガーの体躯、プードルのカットスタイル。犬種の祖から受け継がれてきた特徴を観察し、スケールを変えても損なわれない造形として再構築します。
      - generic [ref=f3e58]:
        - text: "2"
        - heading "3Dモデリングと受注生産" [level=3] [ref=f3e59]
        - paragraph [ref=f3e60]: 原型は3Dモデリングで設計し、3Dプリンターで一体ずつ製造・仕上げ。在庫を持たない受注生産により、多犬種・多サイズのラインナップ展開を可能にしています。
      - generic [ref=f3e61]:
        - text: "3"
        - heading "世界中のオーナーの手に" [level=3] [ref=f3e62]
        - paragraph [ref=f3e63]: 大きすぎず、小さすぎず、飾る場所を選ばない。海外発送にも対応し、世界中の大型犬オーナーにとっての「ちょうどいい存在」であることを目指します。
  - generic [ref=f3e65]:
    - generic [ref=f3e66]:
      - generic [ref=f3e67]: "03"
      - generic [ref=f3e68]: Designer
    - generic [ref=f3e69]:
      - generic [ref=f3e70]:
        - figure "Takuya Nameki with BEN & OBI" [ref=f3e71]:
          - img "TAKUYA NAMEKI と BEN、OBI のポートレート" [ref=f3e72]
          - generic [ref=f3e73]: Takuya Nameki with BEN & OBI
        - generic [ref=f3e74]:
          - paragraph [ref=f3e75]: BIG Dog Director
          - heading "TAKUYA NAMEKI" [level=3] [ref=f3e76]
          - paragraph [ref=f3e77]: Designer / Founder
      - generic [ref=f3e78]:
        - heading "プロフィール" [level=2] [ref=f3e79]
        - paragraph [ref=f3e80]: 幼少期から犬が好きで、大型犬と暮らすことを夢見て育つ。現在は、イングリッシュゴールデンレトリバーの「BEN」と、バーニーズマウンテンドッグの「OBI」——ふたりの相棒とともに暮らしている。
        - paragraph [ref=f3e81]: 自分が本当に欲しいと思える大型犬モチーフのグッズが、世の中には少ない。その思いから、まずは自分自身のためにフィギュアを作りはじめた。やがて、同じ思いを抱く大型犬オーナーへ届けるため、2025年8月、大型犬専門フィギュアブランド「BENOBI bros.」を設立。ブランドの名は、BEN と OBI のふたりから受け継いでいる。
        - paragraph [ref=f3e82]: デザインから製作、仕上げまで。そのすべてを、ひとりの手で行っている。
