      - generic [ref=f2e38]: Concept
    - generic [ref=f2e39]:
      - generic [ref=f2e40]:
        - heading "大きな体の、大きな愛を。 いつでもそばに置けるかたちで。" [level=2] [ref=f2e41]:
          - text: 大きな体の、大きな愛を。
          - text: いつでもそばに置けるかたちで。
        - paragraph [ref=f2e42]: 大型犬と暮らす毎日は、大きな体とおなじくらい、大きな愛にあふれています。けれど、その存在のすべてをいつもそばに置いておくことはできません。
        - paragraph [ref=f2e43]: BENOBI bros. は、その愛らしさを手のひらサイズのフィギュアに写しとるブランドです。ぽってりとしたフォルムの中に、犬種ごとの毛並みや体つき、表情の個性をひとつずつ丁寧に閉じ込めました。
        - paragraph [ref=f2e44]: デスクの上に、本棚の隅に。ふと目が合うたびに、頬がゆるむ。そんな小さな存在をお届けします。
      - figure "small BIG Dogs — Golden Retriever" [ref=f2e45]:
        - img "ゴールデンレトリバーのフィギュア" [ref=f2e46]
        - generic [ref=f2e47]: small BIG Dogs — Golden Retriever
  - generic [ref=f2e49]:
    - generic [ref=f2e50]:
      - generic [ref=f2e51]: "02"
      - generic [ref=f2e52]: Philosophy
    - paragraph [ref=f2e53]:
      - text: 「その子らしさ」を、ちいさなかたちに。
      - text: ブランドに込めた、みっつの思い。
    - generic [ref=f2e54]:
      - generic [ref=f2e55]:
        - text: "1"
        - heading "犬種の個性に、まっすぐ向き合う" [level=3] [ref=f2e56]
        - paragraph [ref=f2e57]: ハスキーの毛量、レオンベルガーの立派な体躯、プードルのカットスタイル。デフォルメしてもなお「その犬種だ」とひと目でわかるように、骨格と表情を観察し、造形に落とし込んでいます。
      - generic [ref=f2e58]:
        - text: "2"
        - heading "3Dプリントと、手仕事のあいだ" [level=3] [ref=f2e59]
        - paragraph [ref=f2e60]: 原型は3Dモデリングで精緻に、仕上げはひとつずつ手作業で。テクノロジーとハンドメイドの両方を行き来しながら、ご注文をいただいてから一体ずつお作りしています。
      - generic [ref=f2e61]:
        - text: "3"
        - heading "大型犬好きの、日常のそばに" [level=3] [ref=f2e62]
        - paragraph [ref=f2e63]: 飾って眺めるフィギュアだけでなく、傘のめじるしになるマーカーや、守り神としての狛犬まで。大型犬への愛が、暮らしのいろいろな場面にそっと寄り添うことを目指しています。
