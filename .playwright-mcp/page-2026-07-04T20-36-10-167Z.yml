          - heading "TAKUYA NAMEKI" [level=3] [ref=f2e76]
          - paragraph [ref=f2e77]: Designer / Founder
      - generic [ref=f2e78]:
        - heading "つくり手について" [level=2] [ref=f2e79]
        - paragraph [ref=f2e80]: 幼少期から犬が好きで、大型犬と暮らすことを夢見て育つ。現在は、イングリッシュゴールデンレトリバーの「BEN」と、バーニーズマウンテンドッグの「OBI」——ふたりの相棒とともに暮らしている。
        - paragraph [ref=f2e81]: 自分が本当に欲しいと思える大型犬モチーフのグッズが、世の中には少ない。その思いから、まずは自分自身のためにフィギュアを作りはじめた。やがて、同じ思いを抱く大型犬オーナーへ届けるため、2025年8月、大型犬専門フィギュアブランド「BENOBI bros.」を設立。ブランドの名は、BEN と OBI のふたりから受け継いでいる。
        - paragraph [ref=f2e82]: デザインから製作、仕上げまで。そのすべてを、ひとりの手で行っている。
