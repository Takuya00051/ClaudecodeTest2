        - paragraph [ref=f4e22]: BENOBI bros.（ベンオビブラザーズ）は、大型犬専門のフィギュアブランド。犬種の祖から受け継がれた「らしさ」をフィギュアに落とし込み、世界中の大型犬オーナーが手に取れる、ちょうどいい存在を目指しています。
