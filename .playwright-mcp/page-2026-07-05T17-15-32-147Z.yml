      - generic [ref=f4e32]: Concept
    - generic [ref=f4e33]:
      - generic [ref=f4e34]:
        - heading "犬種らしさを、 手に取れるスケールに。" [level=2] [ref=f4e35]:
          - text: 犬種らしさを、
          - text: 手に取れるスケールに。
        - paragraph [ref=f4e36]: 大型犬には、犬種ごとに受け継がれてきた固有の骨格、毛量、たたずまいがあります。BENOBI bros. がフィギュアに落とし込むのは、その「犬種らしさ」そのものです。
        - paragraph [ref=f4e37]: スケールを変えても、ひと目で「その犬種だ」とわかること。造形のすべてを、その基準で判断しています。
        - paragraph [ref=f4e38]: 目指すのは、大きすぎず、小さすぎず、飾る場所を選ばない——世界中の大型犬オーナーが手に取れる「ちょうどいい存在」です。
      - figure "small BIG Dogs — Golden Retriever" [ref=f4e39]:
        - img "ゴールデンレトリバーのフィギュア" [ref=f4e40]
        - generic [ref=f4e41]: small BIG Dogs — Golden Retriever
  - generic [ref=f4e43]:
    - generic [ref=f4e44]:
      - generic [ref=f4e45]: "02"
      - generic [ref=f4e46]: Philosophy
    - paragraph [ref=f4e47]:
      - text: 犬種の祖から受け継がれた「らしさ」を、フィギュアへ。
      - text: ブランドを支える、みっつの基準。
    - generic [ref=f4e48]:
      - generic [ref=f4e49]:
        - text: "1"
        - heading "犬種らしさへの解像度" [level=3] [ref=f4e50]
        - paragraph [ref=f4e51]: ハスキーの毛量、レオンベルガーの体躯、プードルのカットスタイル。犬種の祖から受け継がれてきた特徴を観察し、スケールを変えても損なわれない造形として再構築します。
      - generic [ref=f4e52]:
        - text: "2"
        - heading "3Dモデリングと受注生産" [level=3] [ref=f4e53]
        - paragraph [ref=f4e54]: 原型は3Dモデリングで設計し、3Dプリンターで一体ずつ製造・仕上げ。在庫を持たない受注生産により、多犬種・多サイズのラインナップ展開を可能にしています。
      - generic [ref=f4e55]:
        - text: "3"
        - heading "世界中のオーナーの手に" [level=3] [ref=f4e56]
        - paragraph [ref=f4e57]: 大きすぎず、小さすぎず、飾る場所を選ばない。海外発送にも対応し、世界中の大型犬オーナーにとっての「ちょうどいい存在」であることを目指します。
  - generic [ref=f4e59]:
