          - heading "TAKUYA NAMEKI" [level=3] [ref=f5e70]
          - paragraph [ref=f5e71]: Designer / Founder
      - generic [ref=f5e72]:
        - heading "プロフィール" [level=2] [ref=f5e73]
        - paragraph [ref=f5e74]: 幼少期から犬が好きで、大型犬と暮らすことを夢見て育つ。現在は、イングリッシュゴールデンレトリバーの「BEN」と、バーニーズマウンテンドッグの「OBI」——ふたりの相棒とともに暮らしている。
        - paragraph [ref=f5e75]: 自分が本当に欲しいと思える大型犬モチーフのグッズが、世の中には少ない。その思いから、まずは自分自身のためにフィギュアを作りはじめた。やがて、同じ思いを抱く大型犬オーナーへ届けるため、2025年8月、大型犬専門フィギュアブランド「BENOBI bros.」を設立。ブランドの名は、BEN と OBI のふたりから受け継いでいる。
        - paragraph [ref=f5e76]: デザインから製作、仕上げまで。そのすべてを、ひとりの手で行っている。
