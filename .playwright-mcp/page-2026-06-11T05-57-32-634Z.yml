    - heading "導入事例" [level=2] [ref=e53]
    - generic [ref=e54]:
      - generic [ref=e56]:
        - heading "クラウド会計ソフト「freee」" [level=3] [ref=e57]
        - figure [ref=e59]:
          - img "freee" [ref=e60]
        - paragraph [ref=e61]:
          - text: 注文数が多いネットショップは、入金、手数料、取消などの決済関連のやりとりも多く、これらを全て手入力で会計帳簿に入力する場合は、 データ入力に手間がかかり、転記ミスなども生じるため、経理業務は運営者の大きな負担となっていました。
          - text: BASEとの連携により、BASEをお使いのネットショップのオーナー様は売上高はもちろん、決済手数料や送料などの各種手数料まで自動でクラウド会計ソフト freeeに取り込むことができます。
          - text: これにより、会計帳簿への転記作業がなくなり、記帳が自動で完結するため、経理業務にかける時間が大幅に短縮することができます。
      - generic [ref=e63]:
        - heading "Ameba Ownd「Ownd ショップ」" [level=3] [ref=e64]
        - figure [ref=e66]:
          - img "ownd shop" [ref=e67]
        - paragraph [ref=e68]:
          - text: 「AmebaOwnd」はブログのような気軽さでデザイン性の高いウェブサイトを制作することができるサービスです。一般ユーザーに加え、著名人や、企業、店舗のビジネス利用など、幅広いシーンで活用されています。
          - text: ユーザーから要望の高かったEC機能「Owndショップ」を「BASE API」と連携することで、初期費用、月額費用ともに無料でEC機能を利用することが可能となりました。
          - text: 新規ショップ開設を「AmebaOwnd」上で行えるほか、作成した同じドメイン内にショップを開設できます。また、商品登録や売上の確認なども「AmebaOwnd」の管理画面で行うことができます。
      - generic [ref=e70]:
        - heading "BASE DESIGN MARKET" [level=3] [ref=e71]
        - figure [ref=e73]:
          - img "BASE DESIGN MARKET" [ref=e74]
        - paragraph [ref=e75]:
          - text: 無料のテンプレートでは物足りないあなたに。クリエイターが作成したオリジナルのテンプレートが集まるBASE DESIGN MARKET。
          - text: お気に入りのテンプレートを見つけて、あなたのショップデザインをレベルアップ。ネットショップのデザインにとことんこだわりたいあなたに。
          - text: HTML編集APPを使って、html/css/javascriptを自由に編集。
          - text: あなたが作ったオリジナルテンプレートを、BASE DESIGN MARKETで販売することもできます。
