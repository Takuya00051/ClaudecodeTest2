                        - text: シェパード small BIG Dogs™ 狛シェパ ▷ “狛犬” とは？ 神社の入口で見かける、2体の石像ワンココンビ。 邪気を追い払い福を呼ぶ――そんな頼もしい守り神です。 狛犬が乗っている台座には、 一般的に、右に「奉」、左に「献」で奉献（ほうけん）と刻まれています。 これは「心をこめて神さまにプレゼントを渡す」という意味です。 ▷台座の文字に込めた意味 狛シェパが乗っている台座には、読みはそのまま「宝犬」と刻みました。 宝 … “かけがえのない宝物” 犬 … “いつもそばで守ってくれる” 2つ並べて「宝犬」＝“Treasure Dog” 愛犬への感謝もたっぷり込めました。 いつものまるっと優しい表情で優しく見守ってくれる狛シェパ。 あなたのお部屋に、ほっこり幸せな守り神を迎えてみませんか？ ⸻ 【商品ラインナップ】 ・右狛シェパ：フィギュア＋台座（宝） ・左狛シェパ：フィギュア＋台座（犬） ※左右は別売です。そろえて飾ると「宝犬」の二文字が完成します。 ※フィギュアと台座はマグネットで脱着できます。 ※左右で別犬種をお選び頂いてもかわいいです！ 【サイズ】 ・フィギュア：高さ50mm×横40mm×奥行50 mm ・台座：高さ65×横58×奥行48 mm ※寸法には若干の誤差がある場合がございます。 ⸻ 【ご購入前にご確認ください】 本商品は3Dプリンターで製作しているため、積層跡やわずかな個体差が見られる場合がございます。 製品仕様の詳細については、「当ショップ製品について」（ALL ITEMの最上部）をご確認ください。 【関連キーワード】 大型犬/ビッグドッグス/BIGDOGS/3Dプリント/ハンドメイド/犬雑貨/ドッググッズ/犬グッズ/インテリア/オブジェ/置物/ギフト/プレゼント/可愛い/かわいい/ミニチュア/ペットグッズ/犬モデル/犬モチーフ/おしゃれ/ナチュラル/デザイン雑貨/癒し/インスタ映え/ペット dog/dogs/pet/pets/figurine/handmade/gift/interior/decoration/toy/animal/3dprint
