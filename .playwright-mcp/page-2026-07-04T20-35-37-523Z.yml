        - paragraph [ref=e39]: BENOBI bros. は、その愛らしさを手のひらサイズのフィギュアに写しとるブランドです。ぽってりとしたフォルムの中に、犬種ごとの毛並みや体つき、表情の個性をひとつずつ丁寧に閉じ込めました。
        - paragraph [ref=e40]: デスクの上に、本棚の隅に。ふと目が合うたびに、頬がゆるむ。そんな小さな存在をお届けします。
