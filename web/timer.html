<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイマー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    .container {
      text-align: center;
      background: #16213e;
      border-radius: 20px;
      padding: 40px 50px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      width: 340px;
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: #a0a8c8;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    .display {
      font-size: 5rem;
      font-weight: 200;
      letter-spacing: 4px;
      color: #e2e8f0;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }

    .display.warning { color: #f6ad55; }
    .display.danger  { color: #fc8181; }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #2d3561;
      border-radius: 2px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #667eea;
      border-radius: 2px;
      width: 100%;
      transition: width 0.5s linear, background 0.5s;
    }

    .progress-fill.warning { background: #f6ad55; }
    .progress-fill.danger  { background: #fc8181; }

    .input-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .time-input {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .time-input label {
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: #6b7280;
      text-transform: uppercase;
    }

    .time-input input {
      width: 64px;
      padding: 8px 4px;
      text-align: center;
      background: #0f3460;
      border: 1px solid #2d3561;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 1.3rem;
      outline: none;
    }

    .time-input input:focus {
      border-color: #667eea;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 1px;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.3; cursor: default; }

    #btnStart  { background: #667eea; color: #fff; }
    #btnPause  { background: #4a5568; color: #e2e8f0; }
    #btnReset  { background: #2d3748; color: #a0aec0; }

    .alert {
      margin-top: 18px;
      font-size: 0.9rem;
      color: #fc8181;
      min-height: 1.2em;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>タイマー</h1>

  <div class="display" id="display">00:00</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="input-row">
    <div class="time-input">
      <label>時</label>
      <input type="number" id="inputH" min="0" max="99" value="0">
    </div>
    <div class="time-input">
      <label>分</label>
      <input type="number" id="inputM" min="0" max="59" value="5">
    </div>
    <div class="time-input">
      <label>秒</label>
      <input type="number" id="inputS" min="0" max="59" value="0">
    </div>
  </div>

  <div class="buttons">
    <button id="btnStart">スタート</button>
    <button id="btnPause" disabled>一時停止</button>
    <button id="btnReset">リセット</button>
  </div>

  <div class="alert" id="alert"></div>
</div>

<script>
  let total = 0, remaining = 0, interval = null, running = false;

  const display      = document.getElementById('display');
  const progressFill = document.getElementById('progressFill');
  const alert        = document.getElementById('alert');
  const btnStart     = document.getElementById('btnStart');
  const btnPause     = document.getElementById('btnPause');
  const btnReset     = document.getElementById('btnReset');
  const inputH = document.getElementById('inputH');
  const inputM = document.getElementById('inputM');
  const inputS = document.getElementById('inputS');

  function format(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
    return `${pad(m)}:${pad(s)}`;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateDisplay() {
    display.textContent = format(remaining);
    const pct = total > 0 ? (remaining / total) * 100 : 100;
    progressFill.style.width = pct + '%';

    const urgent = remaining <= 10 && remaining > 0;
    const warn   = remaining <= 30 && remaining > 10;

    display.className = 'display' + (urgent ? ' danger' : warn ? ' warning' : '');
    progressFill.className = 'progress-fill' + (urgent ? ' danger' : warn ? ' warning' : '');
  }

  function start() {
    if (running) return;
    if (remaining === 0) {
      const h = parseInt(inputH.value) || 0;
      const m = parseInt(inputM.value) || 0;
      const s = parseInt(inputS.value) || 0;
      total = h * 3600 + m * 60 + s;
      remaining = total;
      if (total <= 0) return;
    }
    alert.textContent = '';
    running = true;
    btnStart.disabled = true;
    btnPause.disabled = false;
    setInputs(true);

    interval = setInterval(() => {
      remaining--;
      updateDisplay();
      if (remaining <= 0) finish();
    }, 1000);
  }

  function pause() {
    clearInterval(interval);
    running = false;
    btnStart.disabled = false;
    btnPause.disabled = true;
    btnStart.textContent = '再開';
  }

  function reset() {
    clearInterval(interval);
    running = false;
    remaining = 0;
    total = 0;
    display.textContent = '00:00';
    display.className = 'display';
    progressFill.style.width = '100%';
    progressFill.className = 'progress-fill';
    alert.textContent = '';
    btnStart.textContent = 'スタート';
    btnStart.disabled = false;
    btnPause.disabled = true;
    setInputs(false);
  }

  function finish() {
    clearInterval(interval);
    running = false;
    alert.textContent = '時間になりました！';
    btnStart.disabled = false;
    btnPause.disabled = true;
    btnStart.textContent = 'スタート';
    setInputs(false);
    try { new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAA==').play(); } catch(e) {}
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('タイマー終了', { body: '時間になりました！' });
    }
  }

  function setInputs(disabled) {
    inputH.disabled = inputM.disabled = inputS.disabled = disabled;
  }

  btnStart.addEventListener('click', start);
  btnPause.addEventListener('click', pause);
  btnReset.addEventListener('click', reset);

  if ('Notification' in window) Notification.requestPermission();
</script>
</body>
</html>
