<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>棒人間ランナー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Arial', sans-serif;
    color: #fff;
  }
  canvas {
    border: 3px solid #e94560;
    border-radius: 8px;
    background: #0f3460;
    cursor: pointer;
  }
  #ui {
    display: flex;
    justify-content: space-between;
    width: 800px;
    margin-bottom: 8px;
    font-size: 18px;
    font-weight: bold;
  }
  #score { color: #e94560; }
  #hi-score { color: #f5a623; }
  #hint {
    font-size: 13px;
    color: #aaa;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div id="ui">
  <span id="score">スコア: 0</span>
  <span id="hi-score">ハイスコア: 0</span>
</div>
<canvas id="c" width="800" height="280"></canvas>
<div id="hint">スペース / クリック でジャンプ（2段ジャンプ可）</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND = H - 50;

// ---- 状態 ----
let state = 'idle'; // idle | playing | dead
let score = 0, hiScore = 0, frame = 0, speed = 5;
let particles = [];
let clouds = [];
let bgOffset = 0;

// ---- 棒人間 ----
const player = {
  x: 120, y: GROUND, vy: 0,
  jumpCount: 0,
  maxJumps: 2,
  w: 20, h: 50,
  legAngle: 0,
  armAngle: 0,
  dead: false,
  reset() {
    this.y = GROUND; this.vy = 0;
    this.jumpCount = 0; this.dead = false;
  },
  jump() {
    if (this.jumpCount < this.maxJumps) {
      this.vy = -14;
      this.jumpCount++;
      spawnParticles(this.x, this.y, '#88ccff', 6);
    }
  },
  update() {
    if (state !== 'playing') return;
    this.vy += 0.7;
    this.y += this.vy;
    if (this.y >= GROUND) {
      this.y = GROUND;
      this.vy = 0;
      this.jumpCount = 0;
    }
    const t = frame / 6;
    this.legAngle = Math.sin(t * 2) * 0.6;
    this.armAngle = -Math.sin(t * 2) * 0.5;
  },
  draw() {
    const cx = this.x;
    // this.y = 足の位置（地面）、上向きに描画
    const feet  = this.y;
    const hip   = feet - 18;
    const shldr = feet - 34;
    const head  = feet - 44;
    const onGround = this.y >= GROUND - 1;
    const col = this.dead ? '#ff4444' : '#ffffff';

    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    // 頭
    ctx.beginPath();
    ctx.arc(cx, head, 8, 0, Math.PI * 2);
    ctx.stroke();

    // 胴体
    ctx.beginPath();
    ctx.moveTo(cx, head + 8);
    ctx.lineTo(cx, hip);
    ctx.stroke();

    // 腕（走るアニメ）
    const armSwing = onGround ? this.armAngle : 0;
    ctx.beginPath();
    ctx.moveTo(cx, shldr);
    ctx.lineTo(cx + Math.cos(armSwing + 0.5) * 14, shldr + Math.sin(armSwing + 0.5) * 12);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, shldr);
    ctx.lineTo(cx + Math.cos(-armSwing - 0.5) * 14, shldr + Math.sin(-armSwing + 0.5) * 12);
    ctx.stroke();

    // 脚（走るアニメ）
    const legSwing = onGround ? this.legAngle : 0;
    ctx.beginPath();
    ctx.moveTo(cx, hip);
    ctx.lineTo(cx + Math.sin(legSwing) * 12,  hip + 12);
    ctx.lineTo(cx + Math.sin(legSwing) * 16,  feet);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, hip);
    ctx.lineTo(cx - Math.sin(legSwing) * 12,  hip + 12);
    ctx.lineTo(cx - Math.sin(legSwing) * 16,  feet);
    ctx.stroke();

    ctx.restore();
  },
  getBox() {
    // 足(this.y)から頭頂まで上向きのヒットボックス
    return { x: this.x - 10, y: this.y - this.h, w: 20, h: this.h };
  }
};

// ---- 障害物 ----
let obstacles = [];
let obstacleTimer = 0;
let obstacleInterval = 80;

const OBSTACLE_TYPES = [
  // ブロック（低い）
  { w: 24, h: 32, color: '#e94560', label: 'block' },
  // ブロック（高い）
  { w: 20, h: 52, color: '#c0392b', label: 'tall' },
  // 浮いている障害物
  { w: 26, h: 20, color: '#9b59b6', label: 'float', floatY: 35 },
];

function spawnObstacle() {
  const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
  const floatY = type.floatY !== undefined ? GROUND - type.floatY - type.h : GROUND - type.h;
  obstacles.push({
    x: W + 10, y: floatY,
    w: type.w, h: type.h,
    color: type.color,
    label: type.label
  });
}

function updateObstacles() {
  obstacleTimer++;
  if (obstacleTimer >= obstacleInterval) {
    spawnObstacle();
    obstacleTimer = 0;
    obstacleInterval = 60 + Math.random() * 60;
  }
  for (let o of obstacles) {
    o.x -= speed;
  }
  obstacles = obstacles.filter(o => o.x + o.w > 0);
}

function drawObstacles() {
  for (let o of obstacles) {
    ctx.save();
    ctx.fillStyle = o.color;
    ctx.shadowColor = o.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    // ハイライト
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(o.x, o.y, o.w, 4);
    ctx.restore();
  }
}

// ---- 当たり判定 ----
function checkCollision() {
  const p = player.getBox();
  for (let o of obstacles) {
    if (
      p.x < o.x + o.w &&
      p.x + p.w > o.x &&
      p.y < o.y + o.h &&
      p.y + p.h > o.y
    ) return true;
  }
  return false;
}

// ---- パーティクル ----
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: Math.random() * -5 - 1,
      life: 1,
      color
    });
  }
}

function updateParticles() {
  for (let p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.04;
  }
  particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
  for (let p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ---- 雲 ----
function initClouds() {
  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({ x: Math.random() * W, y: 20 + Math.random() * 60, r: 15 + Math.random() * 20 });
  }
}

function updateClouds() {
  for (let c of clouds) {
    c.x -= speed * 0.2;
    if (c.x + c.r < 0) {
      c.x = W + c.r;
      c.y = 20 + Math.random() * 60;
    }
  }
}

function drawClouds() {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  for (let c of clouds) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.arc(c.x + c.r * 0.8, c.y - c.r * 0.3, c.r * 0.7, 0, Math.PI * 2);
    ctx.arc(c.x - c.r * 0.8, c.y - c.r * 0.2, c.r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ---- 地面 ----
function drawGround() {
  // 地面ライン
  ctx.save();
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(W, GROUND);
  ctx.stroke();
  ctx.restore();

  // 走る線（地面の質感）
  bgOffset = (bgOffset + speed) % 40;
  ctx.save();
  ctx.strokeStyle = 'rgba(233,69,96,0.25)';
  ctx.lineWidth = 1;
  for (let x = -bgOffset; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND + 4);
    ctx.lineTo(x + 20, GROUND + 4);
    ctx.stroke();
  }
  ctx.restore();
}

// ---- スコア表示 ----
function drawScoreEl() {
  document.getElementById('score').textContent = 'スコア: ' + score;
  document.getElementById('hi-score').textContent = 'ハイスコア: ' + hiScore;
}

// ---- オーバーレイ ----
function drawOverlay() {
  if (state === 'idle') {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('棒人間ランナー', W / 2, H / 2 - 20);
    ctx.font = '20px Arial';
    ctx.fillStyle = '#aaaaaa';
    ctx.fillText('スペース / クリック でスタート', W / 2, H / 2 + 20);
    ctx.restore();
  } else if (state === 'dead') {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('ゲームオーバー', W / 2, H / 2 - 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px Arial';
    ctx.fillText('スコア: ' + score, W / 2, H / 2 + 10);
    ctx.fillStyle = '#aaa';
    ctx.font = '18px Arial';
    ctx.fillText('スペース / クリック でリスタート', W / 2, H / 2 + 44);
    ctx.restore();
  }
}

// ---- ゲームリセット ----
function startGame() {
  state = 'playing';
  score = 0;
  frame = 0;
  speed = 5;
  obstacles = [];
  obstacleTimer = 0;
  obstacleInterval = 90;
  particles = [];
  player.reset();
  initClouds();
}

// ---- メインループ ----
function loop() {
  ctx.clearRect(0, 0, W, H);

  drawClouds();
  drawGround();

  if (state === 'playing') {
    frame++;
    score++;
    speed = 5 + Math.floor(score / 300) * 0.5;
    if (hiScore < score) hiScore = score;

    updateClouds();
    updateObstacles();
    player.update();
    updateParticles();

    if (checkCollision()) {
      state = 'dead';
      player.dead = true;
      spawnParticles(player.x, player.y - 25, '#e94560', 20);
    }
  } else if (state === 'idle') {
    updateClouds();
  } else if (state === 'dead') {
    updateParticles();
  }

  drawObstacles();
  player.draw();
  drawParticles();
  drawOverlay();
  drawScoreEl();

  requestAnimationFrame(loop);
}

// ---- 入力 ----
function onAction() {
  if (state === 'idle' || state === 'dead') {
    startGame();
  } else if (state === 'playing') {
    player.jump();
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    onAction();
  }
});
canvas.addEventListener('click', onAction);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onAction(); }, { passive: false });

// ---- 初期化 ----
initClouds();
loop();
</script>
</body>
</html>
